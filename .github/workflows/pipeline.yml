name: Tourism Project Pipeline

on:
  push:
    branches:
      # Automatically triggers on push to the main branch
      - main
  # lets click "Run workflow" in the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- Registering Dataset -------------------
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        # path to the project's requirements file.
        run: pip install -r tourism_project/requirements.txt
      - name: Register Dataset
        # path to the dataset registration script.
        run: python tourism_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          #path to the raw dataset inside your data folder
          path: tourism_project/data/tourism.csv

  #---------------Data Preparation ----------------
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
      # path to your project's requirements file.
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        # Path to your data preparation script.
        run: python tourism_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # ------------------Model Training + MFLOW TRACKING ------------
  model-traning:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
      # Path to your project's requirements file.
        run: pip install -r tourism_project/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          # brings Xtrain/Xtest/ytrain/ytest from Job Data preparation
          name: data-splits
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5  # Wait for a moment to let the server starts
      - name: Model Building
        # Path to your model training script.
        run: python tourism_project/model_building/train.py
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Path to your deployment folder.
          git add tourism_project/deployment/*.joblib
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
